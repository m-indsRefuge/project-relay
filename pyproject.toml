[project]
name = "project-relay"
version = "0.1.0"
description = "A LangGraph learning and engineering experiment using four small local language models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "ddgs==9.16.0",
    "httpx>=0.28,<0.29",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "pydantic>=2.13,<3",
]
[project.optional-dependencies]
dev = ["pytest>=9.0,<10", "pytest-cov>=7.0,<8", "ruff>=0.16,<0.17"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/relay"]